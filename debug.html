<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FP2 Debug</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#0f172a;color:#fff;padding:20px;line-height:1.6}.card{background:#1e293b;padding:16px;border-radius:14px;margin:10px 0}.ok{color:#86efac}.ng{color:#fca5a5}.wait{color:#fde68a}code{word-break:break-all}</style></head><body><h1>FP2 Quest 診断</h1><div id="out" class="card">診断開始…</div><script>const files=['questions-extra.js','questions-pack2.js','questions-pack3.js','questions-pack4.js','questions-pack5.js','questions-pack6.js','questions-pack7.js','questions-pack8.js','questions-pack9.js','questions-pack10.js','questions-pack11.js','questions-pack12.js','questions-pack13.js','questions-pack14.js'];let i=0;const out=document.getElementById('out');function add(t,c){out.innerHTML+=`<div class="${c}">${t}</div>`}window.onerror=function(msg,src,line,col,err){add('❌ JSエラー: '+msg+' @ '+(src||'inline')+':'+line+':'+col,'ng');return false};function next(){if(i>=files.length){add('✅ 全JSの読み込み完了','ok');try{let count=0;if(typeof extraQuestions!=='undefined')count+=extraQuestions.length;if(typeof extraQuestions2!=='undefined')count+=extraQuestions2.length;if(typeof extraQuestions3!=='undefined')count+=extraQuestions3.length;if(typeof extraQuestions4!=='undefined')count+=extraQuestions4.length;if(typeof extraQuestions5!=='undefined')count+=extraQuestions5.length;if(typeof extraQuestions6!=='undefined')count+=extraQuestions6.length;if(typeof extraQuestions7!=='undefined')count+=extraQuestions7.length;if(typeof extraQuestions8!=='undefined')count+=extraQuestions8.length;add('読込問題数（core除く）: '+count,'ok')}catch(e){add('集計エラー: '+e.message,'ng')}return}const f=files[i++];add('読み込み: '+f,'wait');const s=document.createElement('script');s.src=f+'?debug=21';s.onload=()=>{add('OK: '+f,'ok');next()};s.onerror=()=>{add('❌ ファイル読込失敗: '+f,'ng');next()};document.body.appendChild(s)}out.innerHTML='';next();</script></body></html>
