<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><title>FP2 Quest</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;margin:0 -16px 18px;padding:24px 20px;border-radius:0 0 26px 26px}.hero h1{margin:0;font-size:29px}.hero p{opacity:.82;margin:6px 0 0}.card,.btn{background:#fff;border-radius:18px;box-shadow:0 5px 20px #0f172a0c}.card{padding:16px;margin:12px 0}.btn{width:100%;border:0;padding:15px;margin:6px 0;text-align:left;font-size:16px;font-weight:700;color:#172033}.primary{background:#2563eb;color:#fff;text-align:center}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:10px}.row>*{flex:1}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.pill{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px}.head{display:flex;align-items:center;gap:10px}.back{border:0;background:#fff;border-radius:10px;padding:10px}.q{font-size:21px;line-height:1.6;font-weight:700}.choice{display:block;width:100%;padding:15px;margin:9px 0;border:2px solid #e2e8f0;border-radius:14px;background:#fff;text-align:left;font-size:16px}.good{border-color:#22c55e;background:#f0fdf4}.bad{border-color:#ef4444;background:#fef2f2}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:flex;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid #e2e8f0;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.nav button{flex:1;border:0;background:none;font-size:12px;color:#64748b}.section{font-weight:800;margin:22px 2px 8px}.tag{font-size:12px;color:#64748b}</style></head><body><main id="app" class="app"></main><script src="questions-extra.js"></script><script src="questions-pack2.js"></script><script>
const domains={A:['ライフプランニングと資金計画',['FPと倫理','FPと関連法規','ライフプランニングの考え方・手法','社会保険','公的年金','企業年金・個人年金等','年金と税金','ライフプラン策定上の資金計画','中小法人の資金計画','ローンとカード','最新の動向']],B:['リスク管理',['リスクマネジメント','保険制度全般','生命保険','損害保険','第三分野の保険','リスク管理と保険','最新の動向']],C:['金融資産運用',['マーケット環境の理解','預貯金・金融類似商品等','投資信託','債券投資','株式投資','外貨建商品','保険商品','金融派生商品','ポートフォリオ運用','金融商品と税金','セーフティネット','関連法規','最新の動向']],D:['タックスプランニング',['わが国の税制','所得税の仕組み','各種所得の内容','損益通算','所得控除','税額控除','所得税の申告と納付','個人住民税','個人事業税','法人税','法人住民税','法人事業税','消費税','会社・役員間および会社間の税務','決算書と法人税申告書','諸外国の税制度','最新の動向']],E:['不動産',['不動産の見方','不動産の取引','不動産に関する法令上の規制','不動産の取得・保有に係る税金','不動産の譲渡に係る税金','不動産の賃貸','不動産の有効活用','不動産の証券化','最新の動向']],F:['相続・事業承継',['贈与と法律','贈与と税金','相続と法律','相続と税金','相続財産の評価（不動産以外）','相続財産の評価（不動産）','不動産の相続対策','相続と保険の活用','事業承継対策','事業と経営','最新の動向']]};
const questions=[{id:'A05-001',d:'A',s:4,q:'老齢基礎年金の受給開始年齢は、原則として何歳か。',c:['60歳','62歳','65歳','70歳'],a:2,e:'老齢基礎年金は原則65歳から受給します。',k:'公的年金',law:'2026-04-01'},{id:'A05-002',d:'A',s:4,q:'老齢年金を繰下げ受給した場合の基本的な効果はどれか。',c:['年金額が増額される','年金額が減額される','受給資格期間が短くなる','納付済期間が消滅する'],a:0,e:'繰下げ受給では受給開始を遅らせることで年金額が増額されます。',k:'繰下げ受給',law:'2026-04-01'},{id:'C05-001',d:'C',s:4,q:'株価を1株当たり利益（EPS）で割って求める指標はどれか。',c:['PBR','PER','ROE','配当利回り'],a:1,e:'PER＝株価÷EPSです。',k:'PER',law:'2026-04-01'},{id:'C05-002',d:'C',s:4,q:'自己資本に対して企業がどれだけ利益を上げたかを見る指標はどれか。',c:['PER','PBR','ROE','EPS'],a:2,e:'ROEは自己資本に対する利益の割合を見る指標です。',k:'ROE',law:'2026-04-01'},{id:'D03-001',d:'D',s:2,q:'勤務先から受け取る給与・賞与は原則として何所得か。',c:['事業所得','給与所得','一時所得','雑所得'],a:1,e:'勤務先から受け取る給与や賞与は給与所得です。',k:'給与所得',law:'2026-04-01'},{id:'D03-002',d:'D',s:2,q:'退職により勤務先から受け取る退職金は原則として何所得か。',c:['給与所得','退職所得','一時所得','雑所得'],a:1,e:'退職金は原則として退職所得です。',k:'退職所得',law:'2026-04-01'},{id:'F03-001',d:'F',s:2,q:'相続が開始する原因として正しいものはどれか。',c:['被相続人の死亡','遺言書の作成','婚姻','退職'],a:0,e:'相続は被相続人の死亡によって開始します。',k:'相続の開始',law:'2026-04-01'},...extraQuestions,...extraQuestions2];
const S=JSON.parse(localStorage.getItem('fp2q')||'{"answers":{},"last":null}');function save(){localStorage.setItem('fp2q',JSON.stringify(S))}let route={page:'home'};function ans(q){return S.answers[q.id]}function stats(qs=questions){let d=qs.filter(ans).length,o=qs.filter(q=>ans(q)?.ok).length;return{done:d,total:qs.length,rate:d?Math.round(o/d*100):0}}function shell(x){return `<div class="hero"><h1>FP2 Quest</h1><p>${questions.length}問収録・法令基準 2026-04-01</p></div>${x}<div class="nav"><button onclick="go('home')">🏠<br>ホーム</button><button onclick="go('wrong')">🔥<br>間違い</button><button onclick="go('stats')">📊<br>成績</button></div>`}
function render(){let h='';if(route.page==='home'){let st=stats();h=shell(`<div class="card"><b>全体の学習状況</b><div class="row"><div><span class="muted">進捗</span><br><b>${st.done}/${st.total}問</b></div><div><span class="muted">正答率</span><br><b>${st.rate}%</b></div></div><div class="bar" style="margin-top:12px"><i style="width:${st.total?st.done/st.total*100:0}%"></i></div></div>${S.last?`<button class="btn primary" onclick="resume()">▶ 前回の続きから</button>`:''}<div class="section">📚 範囲から学習</div>${Object.entries(domains).map(([k,v])=>`<button class="btn" onclick="openDomain('${k}')"><span class="pill">${k}</span> ${v[0]}<div class="muted">${questions.filter(q=>q.d===k).length}問</div></button>`).join('')}`)}else if(route.page==='domain'){let v=domains[route.d];h=shell(`<div class="head"><button class="back" onclick="go('home')">←</button><h2>${route.d} ${v[0]}</h2></div>${v[1].map((x,i)=>{let qs=questions.filter(q=>q.d===route.d&&q.s===i),st=stats(qs);return `<button class="btn" onclick="openSub('${route.d}',${i})"><b>${route.d}${String(i+1).padStart(2,'0')} ${x}</b><div class="muted">${qs.length?`${st.done}/${st.total}問・正答率 ${st.rate}%`:'問題準備中'}</div></button>`}).join('')}`)}else if(route.page==='sub'){let name=domains[route.d][1][route.s],qs=questions.filter(q=>q.d===route.d&&q.s===route.s),st=stats(qs);h=shell(`<div class="head"><button class="back" onclick="openDomain('${route.d}')">←</button><h2>${name}</h2></div><div class="card"><b>学習進捗 ${st.done}/${st.total}問</b><div class="bar" style="margin:10px 0"><i style="width:${st.total?st.done/st.total*100:0}%"></i></div><span class="muted">正答率 ${st.rate}%</span></div>${qs.length?`<button class="btn primary" onclick="start('${route.d}',${route.s})">⚡ この範囲を学習する</button><button class="btn" onclick="start('${route.d}',${route.s},true)">🔥 この範囲の間違いだけ</button>`:`<div class="card">この範囲の問題は準備中です。</div>`}`)}else if(route.page==='quiz'){let q=route.qs[route.i];h=shell(`<div class="head"><button class="back" onclick="openSub('${route.d}',${route.s})">×</button><div><b>${q.k}</b><div class="muted">${route.i+1}/${route.qs.length}・${q.id}</div></div></div><div class="card"><span class="tag">本番型・法令基準 ${q.law}</span><div class="q">${q.q}</div>${q.c.map((c,i)=>`<button id="c${i}" class="choice" onclick="answer(${i})">${i+1}. ${c}</button>`).join('')}<button class="choice" onclick="answer(-1)">？ わからない</button><div id="feedback"></div></div>`)}else if(route.page==='wrong'){let qs=questions.filter(q=>ans(q)&&!ans(q).ok);h=shell(`<h2>🔥 間違えた問題</h2>${qs.length?qs.map(q=>`<button class="btn" onclick="jump('${q.id}')">${q.id} ${q.k}<div class="muted">${domains[q.d][0]} › ${domains[q.d][1][q.s]}</div></button>`).join(''):`<div class="card">現在、間違い問題はありません。</div>`}`)}else{h=shell(`<h2>📊 分野別成績</h2>${Object.entries(domains).map(([k,v])=>{let st=stats(questions.filter(q=>q.d===k));return `<div class="card"><b>${k} ${v[0]}</b><div class="row"><span class="muted">進捗 ${st.done}/${st.total}</span><b>${st.rate}%</b></div><div class="bar"><i style="width:${st.rate}%"></i></div></div>`}).join('')}`)}document.getElementById('app').innerHTML=h}function go(p){route={page:p};render()}function openDomain(d){route={page:'domain',d};render()}function openSub(d,s){route={page:'sub',d,s};render()}function start(d,s,w=false){let qs=questions.filter(q=>q.d===d&&q.s===s&&(!w||(ans(q)&&!ans(q).ok)));if(!qs.length){alert('対象の問題がありません');return}route={page:'quiz',d,s,qs,i:0};S.last={d,s};save();render()}function resume(){start(S.last.d,S.last.s)}function jump(id){let q=questions.find(x=>x.id===id);route={page:'quiz',d:q.d,s:q.s,qs:[q],i:0};render()}function answer(i){let q=route.qs[route.i],ok=i===q.a;S.answers[q.id]={ok,at:Date.now()};save();q.c.forEach((_,n)=>{let e=document.getElementById('c'+n);e.disabled=true;if(n===q.a)e.classList.add('good');else if(n===i)e.classList.add('bad')});document.getElementById('feedback').innerHTML=`<div class="card ${ok?'good':'bad'}"><b>${ok?'⭕ 正解':'❌ 不正解'}</b><p>${q.e}</p><button class="btn primary" onclick="nextQ()">${route.i+1<route.qs.length?'次の問題 →':'結果を見る'}</button></div>`}function nextQ(){if(++route.i<route.qs.length)render();else openSub(route.d,route.s)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
