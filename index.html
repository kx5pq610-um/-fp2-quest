<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b8f"><title>FP2 Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:0 14px 92px}.hero{margin:0 -14px 14px;padding:22px 18px;background:linear-gradient(145deg,#132b68,#2454c6);color:#fff;border-radius:0 0 26px 26px}.hero h1{margin:0;font-size:28px}.sub{opacity:.88;font-size:13px;margin:5px 0 13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#ffffff18;border:1px solid #ffffff24;border-radius:13px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.stat span,.muted{font-size:12px;color:#64748b}.stat span{color:#fff;opacity:.85}.card,.btn{background:#fff;border-radius:17px;box-shadow:0 5px 18px #0f172a0c}.card{padding:15px;margin:10px 0}.btn{width:100%;border:0;padding:14px;margin:6px 0;text-align:left;font-size:15px;font-weight:750;color:#172033}.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;text-align:center}.hard{background:#fff7f7;border-left:5px solid #dc2626}.calc{border-left:5px solid #7c3aed}.exam{border-left:5px solid #ea580c}.soft{background:#f8fafc}.section{font-weight:850;margin:21px 3px 8px}.goalnum{font-size:32px;font-weight:900;color:#1d4ed8}.bar{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.head{display:flex;gap:10px;align-items:center;margin:4px 0 12px}.back{border:0;background:#fff;border-radius:10px;padding:9px 11px;font-size:18px}.choice{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid #e2e8f0;border-radius:13px;background:#fff;text-align:left;font-size:16px;line-height:1.45}.good{border-color:#22c55e;background:#f0fdf4}.bad{border-color:#ef4444;background:#fef2f2}.review{border-color:#f59e0b;background:#fffbeb}.q{font-size:20px;line-height:1.6;font-weight:780;margin:8px 0 14px}.tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:#475569;margin-right:4px}.feedback{margin-top:12px;padding:13px;border-radius:14px;background:#f8fafc}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:flex;background:#fffffff3;border-top:1px solid #e2e8f0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:9}.nav button{flex:1;border:0;background:none;font-size:12px;color:#64748b}.domain{display:flex;justify-content:space-between;gap:8px;align-items:center}.score{font-size:40px;font-weight:950}.ok{color:#15803d;font-weight:850}@media(max-width:380px){.grid{grid-template-columns:1fr}.q{font-size:19px}}
</style></head><body><main id="app" class="app"><div class="hero"><h1>FP2 Quest</h1><p class="sub">読み込み中...</p></div><div class="card">問題データを確認しています。</div></main>

<script>(function(){var app=document.getElementById('app');try{
var core=[{id:'A05-001',d:'A',s:4,q:'老齢基礎年金の受給開始年齢は、原則として何歳か。',c:['60歳','62歳','65歳','70歳'],a:2,e:'老齢基礎年金は原則65歳から受給します。',k:'公的年金'}];var all=core.concat(extraQuestions,extraQuestions2,extraQuestions3,extraQuestions4,extraQuestions5,extraQuestions6,extraQuestions7,extraQuestions8),seen={},questions=[];for(var i=0;i<all.length;i++){var z=all[i];if(z&&z.id&&!seen[z.id]&&!z.input){seen[z.id]=1;questions.push(z)}}
var names={A:'ライフプランニングと資金計画',B:'リスク管理',C:'金融資産運用',D:'タックスプランニング',E:'不動産',F:'相続・事業承継'};var subs={A:['FPと倫理','FPと関連法規','ライフプランニングの考え方・手法','社会保険','公的年金','企業年金・個人年金等','年金と税金','ライフプラン策定上の資金計画','中小法人の資金計画','ローンとカード','最新の動向'],B:['リスクマネジメント','保険制度全般','生命保険','損害保険','第三分野の保険','リスク管理と保険','最新の動向'],C:['マーケット環境の理解','預貯金・金融類似商品等','投資信託','債券投資','株式投資','外貨建商品','保険商品','金融派生商品','ポートフォリオ運用','金融商品と税金','セーフティネット','関連法規','最新の動向'],D:['わが国の税制','所得税の仕組み','各種所得の内容','損益通算','所得控除','税額控除','所得税の申告と納付','個人住民税','個人事業税','法人税','法人住民税','法人事業税','消費税','会社・役員間および会社間の税務','決算書と法人税申告書','諸外国の税制度','最新の動向'],E:['不動産の見方','不動産の取引','不動産に関する法令上の規制','不動産の取得・保有に係る税金','不動産の譲渡に係る税金','不動産の賃貸','不動産の有効活用','不動産の証券化','最新の動向'],F:['贈与と法律','贈与と税金','相続と法律','相続と税金','相続財産の評価（不動産以外）','相続財産の評価（不動産）','不動産の相続対策','相続と保険の活用','事業承継対策','事業と経営','最新の動向']};
var S={answers:{},last:null,mocks:[],activity:[],review:{}};try{var old=JSON.parse(localStorage.getItem('fp2q')||'{}');if(old.answers)S.answers=old.answers;if(old.last)S.last=old.last;if(old.mocks)S.mocks=old.mocks;if(old.activity)S.activity=old.activity;if(old.review)S.review=old.review}catch(e){}function save(){try{localStorage.setItem('fp2q',JSON.stringify(S))}catch(e){}}function A(q){return S.answers[q.id]}function stat(qs){var d=0,c=0;for(var j=0;j<qs.length;j++){var a=A(qs[j]);if(a){d++;if(a.ok)c++}}return{done:d,total:qs.length,rate:d?Math.round(c/d*100):0}}function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function hard(q){return q&&(q.style==='challenge'||q.difficulty===3||(q.id||'').indexOf('H-')===0)}function exam(q){return !hard(q)&&/-14[0-9][0-9]$/.test(q.id||'')}function drill(q){return(q.id||'').indexOf('DRILL-')===0}function calc(q){var t=(q.k||'')+' '+(q.q||'');return drill(q)||/計算|利回り|PER|PBR|ROE|可処分所得|必要保障額|建ぺい率|容積率|基礎控除額|法定相続分|円換算|年間利子/.test(t)}function basic(q){return!hard(q)&&!exam(q)&&!drill(q)}function type(q){return hard(q)?'🔥 合格レベル':exam(q)?'🧠 標準・本番型':calc(q)?'🧮 計算':'📘 基本'}function pool(m,b){b=b||questions;return b.filter(function(q){return m==='hard'?hard(q):m==='exam'?exam(q):m==='calc'?calc(q):m==='basic'?basic(q):true})}
function day(ts){var d=new Date(ts),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}function today(){return day(Date.now())}function todayCount(){var x={},t=today();for(var id in S.answers)if(S.answers[id]&&S.answers[id].at&&day(S.answers[id].at)===t)x[id]=1;for(var j=0;j<S.activity.length;j++)if(S.activity[j].at&&day(S.activity[j].at)===t)x[S.activity[j].id]=1;return Object.keys(x).length}function streak(){var ds={},j;for(var id in S.answers)if(S.answers[id]&&S.answers[id].at)ds[day(S.answers[id].at)]=1;for(j=0;j<S.activity.length;j++)if(S.activity[j].at)ds[day(S.activity[j].at)]=1;var d=new Date(),n=0;if(!ds[day(d.getTime())])d.setDate(d.getDate()-1);while(ds[day(d.getTime())]){n++;d.setDate(d.getDate()-1)}return n}
function shell(x,sub){var st=stat(questions),lv=Math.floor(st.done/50)+1;return'<div class="hero"><h1>FP2 Quest</h1><p class="sub">'+(sub||'本番で迷わない力をつける。')+'</p><div class="stats"><div class="stat"><b>Lv.'+lv+'</b><span>学習レベル</span></div><div class="stat"><b>🔥 '+streak()+'</b><span>連続学習</span></div><div class="stat"><b>'+st.done+'</b><span>解答済み</span></div></div></div>'+x+'<div class="nav"><button onclick="home()">🏠<br>ホーム</button><button onclick="reviewView()">🔥<br>復習</button><button onclick="statsView()">📊<br>成績</button></div>'}
function daily(){var r=[],h=[],e=[],b=[],rest=[],out=[];for(var j=0;j<questions.length;j++){var q=questions[j],a=A(q);if((a&&!a.ok)||S.review[q.id])r.push(q);else if(!a&&hard(q))h.push(q);else if(!a&&exam(q))e.push(q);else if(!a&&!drill(q))b.push(q);else rest.push(q)}r=sh(r);h=sh(h);e=sh(e);b=sh(b);rest=sh(rest);function take(a,n){while(a.length&&n--&&out.length<10)out.push(a.shift())}take(r,4);take(h,6);take(e,2);take(b,2);take(rest,10);return out.slice(0,10)}
window.home=function(){var st=stat(questions),tc=todayCount(),rem=Math.max(0,10-tc),h='<div class="card"><b>今日の目標</b><div class="goalnum">'+Math.min(tc,10)+' / 10</div><div class="bar"><i style="width:'+Math.min(100,tc*10)+'%"></i></div><p>'+(tc>=10?'🎉 今日の目標達成！':'あと'+rem+'問。合格レベル問題を多めに出します。')+'</p><button class="btn primary" onclick="startDaily()">⚡ 今日の10問</button></div>';if(S.last)h+='<button class="btn soft" onclick="resume()">▶ 前回の続き</button>';h+='<div class="section">🎓 学習モード</div><button class="btn hard" onclick="startMode(\'hard\')">🔥 合格レベル <span class="muted">'+pool('hard').length+'問・複数知識／条件整理／2段階計算</span></button><div class="grid"><button class="btn" onclick="startMode(\'basic\')">📘 基本 <span class="muted">'+pool('basic').length+'問</span></button><button class="btn calc" onclick="startMode(\'calc\')">🧮 計算 <span class="muted">'+pool('calc').length+'問</span></button></div><button class="btn exam" onclick="startMode(\'exam\')">🧠 標準・本番型 <span class="muted">'+pool('exam').length+'問</span></button><div class="section">📚 範囲から学習</div>';for(var d in names){var qs=questions.filter((function(dd){return function(q){return q.d===dd}})(d)),s=stat(qs);h+='<button class="btn" onclick="domain(\''+d+'\')"><div class="domain"><b>'+d+' '+names[d]+'</b><span class="muted">'+s.done+'/'+s.total+'・'+s.rate+'%</span></div></button>'}h+='<div class="section">📝 実力チェック</div><button class="btn primary" onclick="mock()">60問模試</button>';if(S.mocks.length){var m=S.mocks[S.mocks.length-1];h+='<div class="card"><b>直近の模試</b><div class="score" style="font-size:28px">'+m.score+'/60</div></div>'}app.innerHTML=shell(h)};
window.domain=function(d){var h='<div class="head"><button class="back" onclick="home()">←</button><h2>'+d+' '+names[d]+'</h2></div>';for(var s=0;s<subs[d].length;s++){var qs=questions.filter((function(dd,ss){return function(q){return q.d===dd&&q.s===ss}})(d,s)),st=stat(qs),hc=pool('hard',qs).length;h+='<button class="btn" onclick="sub(\''+d+'\','+s+')"><div class="domain"><b>'+subs[d][s]+(hc?' 🔥':'')+'</b><span class="muted">'+qs.length+'問・'+st.rate+'%</span></div></button>'}app.innerHTML=shell(h,names[d])};
window.sub=function(d,s){var qs=questions.filter(function(q){return q.d===d&&q.s===s}),st=stat(qs),hc=pool('hard',qs).length;var h='<div class="head"><button class="back" onclick="domain(\''+d+'\')">←</button><h2>'+subs[d][s]+'</h2></div><div class="card"><b>'+st.done+'/'+st.total+'問・正答率 '+st.rate+'%</b><div class="bar"><i style="width:'+st.rate+'%"></i></div></div>'+(hc?'<button class="btn hard" onclick="startSub(\''+d+'\','+s+',\'hard\')">🔥 合格レベル '+hc+'問</button>':'')+'<button class="btn primary" onclick="startSub(\''+d+'\','+s+',\'all\')">この範囲を学習</button><div class="grid"><button class="btn" onclick="startSub(\''+d+'\','+s+',\'basic\')">📘 基本</button><button class="btn calc" onclick="startSub(\''+d+'\','+s+',\'calc\')">🧮 計算</button></div>';app.innerHTML=shell(h,subs[d][s])};
var ses=null;function start(qs,label,meta){if(!qs.length){alert('対象問題がありません');return}ses={qs:qs,i:0,label:label,kind:meta&&meta.kind||'study',score:0,d:meta&&meta.d,s:meta&&meta.s,ret:meta&&meta.ret,lock:false};show()}window.startDaily=function(){start(daily(),'今日の10問',{ret:true})};window.startMode=function(m){start(sh(pool(m)),m==='hard'?'合格レベル':m==='basic'?'基本知識':m==='calc'?'計算':'標準・本番型',{ret:true})};window.startSub=function(d,s,m){var b=questions.filter(function(q){return q.d===d&&q.s===s});start(m==='all'?b:sh(pool(m,b)),subs[d][s],{d:d,s:s})};
function show(){if(ses.i>=ses.qs.length)return finish();var q=ses.qs[ses.i],rv=!!S.review[q.id];if(ses.kind==='study'){S.last={d:q.d,s:q.s,id:q.id};save()}var h='<div class="head"><button class="back" onclick="home()">×</button><div><b>'+ses.label+'</b><div class="muted">'+(ses.i+1)+' / '+ses.qs.length+'</div></div></div><div class="card"><span class="tag">'+type(q)+'</span><div class="q">'+q.q+'</div>';for(var j=0;j<q.c.length;j++)h+='<button id="c'+j+'" class="choice" onclick="pick('+j+')">'+(j+1)+'. '+q.c[j]+'</button>';if(ses.kind==='study')h+='<button id="rv" class="choice '+(rv?'review':'')+'" onclick="toggle()">⭐ '+(rv?'復習リスト済み':'あとで復習')+'</button>';h+='<div id="fb"></div></div>';app.innerHTML=shell(h,ses.kind==='mock'?'答え合わせは最後':'難しい問題ほど、伸びます。')}
window.toggle=function(){var q=ses.qs[ses.i];S.review[q.id]=!S.review[q.id];if(!S.review[q.id])delete S.review[q.id];save();var b=document.getElementById('rv');b.className='choice '+(S.review[q.id]?'review':'');b.innerHTML='⭐ '+(S.review[q.id]?'復習リスト済み':'あとで復習')};window.pick=function(x){if(ses.lock)return;ses.lock=true;var q=ses.qs[ses.i],ok=x===q.a;if(ses.kind==='mock'){if(ok)ses.score++;ses.i++;ses.lock=false;return show()}S.answers[q.id]={ok:ok,at:Date.now()};S.activity.push({id:q.id,at:Date.now(),ok:ok});if(!ok)S.review[q.id]=true;save();for(var j=0;j<q.c.length;j++){var b=document.getElementById('c'+j);b.disabled=true;if(j===q.a)b.className+=' good';if(j===x&&!ok)b.className+=' bad'}document.getElementById('rv').disabled=true;document.getElementById('fb').innerHTML='<div class="feedback"><b>'+(ok?'○ 正解':'× 不正解')+'</b><p>'+q.e+'</p><button id="next" class="btn primary">'+(ses.i+1===ses.qs.length?'結果':'次へ →')+'</button></div>';document.getElementById('next').onclick=function(){ses.i++;ses.lock=false;show()}};
function finish(){if(ses.kind==='mock'){var sc=ses.score;S.mocks.push({score:sc,at:Date.now()});save();ses=null;app.innerHTML=shell('<h2>📝 模試結果</h2><div class="card"><div class="score">'+sc+'/60</div><p><b>'+(sc>=48?'🏆 8割到達':sc>=36?'✅ 合格基準クリア':'📚 36点まであと'+(36-sc)+'問')+'</b></p></div><button class="btn primary" onclick="mock()">もう一度</button>');return}var d=ses.d,s=ses.s,ret=ses.ret;ses=null;if(ret||d===undefined)return home();sub(d,s)}
window.resume=function(){if(!S.last)return home();var qs=questions.filter(function(q){return q.d===S.last.d&&q.s===S.last.s}),n=0;for(var j=0;j<qs.length;j++)if(qs[j].id===S.last.id){n=j;break}start(qs.slice(n),subs[S.last.d][S.last.s],{d:S.last.d,s:S.last.s})};window.reviewView=function(){var qs=questions.filter(function(q){var a=A(q);return(a&&!a.ok)||S.review[q.id]});var h='<div class="head"><button class="back" onclick="home()">←</button><h2>🔥 要復習</h2></div>'+(qs.length?'<button class="btn primary" onclick="startReview()">'+qs.length+'問を復習</button>':'<div class="card">要復習はありません。</div>');app.innerHTML=shell(h)};window.startReview=function(){var qs=questions.filter(function(q){var a=A(q);return(a&&!a.ok)||S.review[q.id]});start(sh(qs),'要復習',{ret:true})};window.statsView=function(){var h='<div class="head"><button class="back" onclick="home()">←</button><h2>📊 成績</h2></div>';for(var d in names){var qs=questions.filter((function(dd){return function(q){return q.d===dd}})(d)),st=stat(qs);h+='<div class="card"><div class="domain"><b>'+d+' '+names[d]+'</b><b>'+st.rate+'%</b></div><p class="muted">'+st.done+'/'+st.total+'問</p><div class="bar"><i style="width:'+st.rate+'%"></i></div></div>'}app.innerHTML=shell(h)};
window.mock=function(){var qs=[],ds=['A','B','C','D','E','F'];for(var d=0;d<ds.length;d++){var dd=ds[d],hh=sh(questions.filter(function(q){return q.d===dd&&hard(q)})),ee=sh(questions.filter(function(q){return q.d===dd&&exam(q)})),oo=sh(questions.filter(function(q){return q.d===dd&&!hard(q)&&!exam(q)&&!drill(q)})),p=hh.slice(0,4).concat(ee.slice(0,3),oo.slice(0,3));qs=qs.concat(p.slice(0,10))}start(sh(qs),'60問模試',{kind:'mock'})};home()
}catch(e){app.innerHTML='<div class="hero"><h1>FP2 Quest</h1><p class="sub">起動エラー</p></div><div class="card"><b>❌ '+String(e)+'</b></div>'}})();</script></body></html>
