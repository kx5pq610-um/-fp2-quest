<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FP2 Quest</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f7fb;color:#172033}.app{max-width:680px;margin:auto;padding:0 16px 90px}.hero{background:#173b8f;color:white;margin:0 -16px 18px;padding:24px 20px;border-radius:0 0 24px 24px}.card,.btn{background:white;border-radius:16px;box-shadow:0 4px 16px #0001}.card{padding:16px;margin:12px 0}.btn{width:100%;border:0;padding:15px;margin:6px 0;text-align:left;font-size:16px;font-weight:700}.primary{background:#2563eb;color:white;text-align:center}.muted{color:#64748b;font-size:13px}.choice{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid #e2e8f0;border-radius:12px;background:white;text-align:left;font-size:16px}.good{border-color:#22c55e;background:#f0fdf4}.bad{border-color:#ef4444;background:#fef2f2}</style></head><body><main id="app" class="app"><div class="hero"><h1>FP2 Quest</h1><p>読み込み中...</p></div><div class="card">問題データを確認しています。</div></main>
<script src="questions-extra.js?v=24"></script><script src="questions-pack2.js?v=24"></script><script src="questions-pack3.js?v=24"></script><script src="questions-pack4.js?v=24"></script><script src="questions-pack5.js?v=24"></script><script src="questions-pack6.js?v=24"></script><script src="questions-pack7.js?v=24"></script><script src="questions-pack8.js?v=24"></script><script src="questions-pack9.js?v=24"></script><script src="questions-pack10.js?v=24"></script><script src="questions-pack11.js?v=24"></script><script src="questions-pack12.js?v=24"></script><script>extraQuestions8.push(...extraQuestions9,...extraQuestions10,...extraQuestions11,...extraQuestions12);</script><script src="questions-pack13.js?v=24"></script><script src="questions-pack14.js?v=24"></script>
<script>
(function(){
var app=document.getElementById('app');
try{
var core=[{id:'A05-001',d:'A',s:4,q:'老齢基礎年金の受給開始年齢は、原則として何歳か。',c:['60歳','62歳','65歳','70歳'],a:2,e:'老齢基礎年金は原則65歳から受給します。',k:'公的年金',law:'2026-04-01'}];
var all=core.concat(extraQuestions,extraQuestions2,extraQuestions3,extraQuestions4,extraQuestions5,extraQuestions6,extraQuestions7,extraQuestions8);
var seen={};var questions=all.filter(function(q){if(!q||!q.id||seen[q.id])return false;seen[q.id]=1;return true});
var names={A:'ライフプランニングと資金計画',B:'リスク管理',C:'金融資産運用',D:'タックスプランニング',E:'不動産',F:'相続・事業承継'};
function home(){app.innerHTML='<div class="hero"><h1>FP2 Quest</h1><p>'+questions.length+'問収録・目標正答率80%</p></div><div class="card"><b>✅ 正式版で起動しました</b><p class="muted">Safari安全版を正式トップページにしました。</p></div>'+Object.keys(names).map(function(d){return '<button class="btn" onclick="openD(\''+d+'\')">'+d+' '+names[d]+'<div class="muted">'+questions.filter(function(q){return q.d===d}).length+'問</div></button>'}).join('')+'<button class="btn primary" onclick="mock60()">📝 60問模試</button>'}
window.openD=function(d){var qs=questions.filter(function(q){return q.d===d});app.innerHTML='<div class="hero"><h1>'+d+' '+names[d]+'</h1><p>'+qs.length+'問</p></div><button class="btn" onclick="goHome()">← ホーム</button><button class="btn primary" onclick="startList(\''+d+'\')">この分野を学習</button>'};
window.goHome=home;
window.startList=function(d){var qs=questions.filter(function(q){return q.d===d});run(qs,0)};
window.mock60=function(){var qs=[];['A','B','C','D','E','F'].forEach(function(d){var a=questions.filter(function(q){return q.d===d}).sort(function(){return Math.random()-.5}).slice(0,10);qs=qs.concat(a)});run(qs.sort(function(){return Math.random()-.5}),0)};
function run(qs,i){if(i>=qs.length){app.innerHTML='<div class="hero"><h1>終了</h1></div><button class="btn primary" onclick="goHome()">ホームへ</button>';return}var q=qs[i];app.innerHTML='<div class="hero"><h1>FP2 Quest</h1><p>'+(i+1)+'/'+qs.length+'</p></div><div class="card"><b>'+((q.k)||'問題')+'</b><p style="font-size:20px;line-height:1.5;font-weight:700">'+q.q+'</p>'+q.c.map(function(c,x){return '<button id="c'+x+'" class="choice" onclick="pick('+x+')">'+(x+1)+'. '+c+'</button>'}).join('')+'<div id="fb"></div></div>';window.pick=function(x){q.c.forEach(function(_,j){var el=document.getElementById('c'+j);el.disabled=true;if(j===q.a)el.className+=' good';if(j===x&&x!==q.a)el.className+=' bad'});document.getElementById('fb').innerHTML='<p><b>'+(x===q.a?'○ 正解':'× 不正解')+'</b></p><p>'+q.e+'</p><button class="btn primary" id="next">次へ</button>';document.getElementById('next').onclick=function(){run(qs,i+1)}}}
home();
}catch(e){app.innerHTML='<div class="hero"><h1>FP2 Quest</h1><p>起動エラー</p></div><div class="card"><b>❌ '+String(e)+'</b></div>';}
})();
</script></body></html>
