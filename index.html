<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>FP2 Quest</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}.app{max-width:680px;margin:auto;min-height:100vh;padding:0 16px 90px}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;margin:0 -16px 18px;padding:26px 20px;border-radius:0 0 26px 26px}.hero h1{margin:0;font-size:29px}.hero p{opacity:.85;margin:6px 0 0}.card,.btn{background:#fff;border-radius:18px;box-shadow:0 5px 20px #0f172a0c}.card{padding:16px;margin:12px 0}.btn{width:100%;border:0;padding:15px;margin:6px 0;text-align:left;font-size:16px;font-weight:700;color:#172033}.primary{background:#2563eb;color:#fff;text-align:center}.muted{color:#64748b;font-size:13px}.pill{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px}.choice{display:block;width:100%;padding:15px;margin:9px 0;border:2px solid #e2e8f0;border-radius:14px;background:#fff;text-align:left;font-size:16px}.good{border-color:#22c55e;background:#f0fdf4}.bad{border-color:#ef4444;background:#fef2f2}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:flex;background:#fffffff2;border-top:1px solid #e2e8f0;padding:10px}.nav button{flex:1;border:0;background:none;font-size:12px;color:#64748b}.head{display:flex;gap:10px;align-items:center}.back{border:0;background:#fff;border-radius:10px;padding:10px}.q{font-size:20px;line-height:1.55;font-weight:700}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.section{font-weight:800;margin:22px 2px 8px}</style></head><body><main id="app" class="app"><div class="hero"><h1>FP2 Quest</h1><p>起動しています…</p></div><div class="card">読み込み中です。</div></main>
<script src="questions-extra.js?v=20"></script><script src="questions-pack2.js?v=20"></script><script src="questions-pack3.js?v=20"></script><script src="questions-pack4.js?v=20"></script><script src="questions-pack5.js?v=20"></script><script src="questions-pack6.js?v=20"></script><script src="questions-pack7.js?v=20"></script><script src="questions-pack8.js?v=20"></script><script src="questions-pack9.js?v=20"></script><script src="questions-pack10.js?v=20"></script><script src="questions-pack11.js?v=20"></script><script src="questions-pack12.js?v=20"></script><script>extraQuestions8.push(...extraQuestions9,...extraQuestions10,...extraQuestions11,...extraQuestions12);</script><script src="questions-pack13.js?v=20"></script><script src="questions-pack14.js?v=20"></script>
<script>
const domains={A:['ライフプランニングと資金計画',['FPと倫理','FPと関連法規','ライフプランニングの考え方・手法','社会保険','公的年金','企業年金・個人年金等','年金と税金','ライフプラン策定上の資金計画','中小法人の資金計画','ローンとカード','最新の動向']],B:['リスク管理',['リスクマネジメント','保険制度全般','生命保険','損害保険','第三分野の保険','リスク管理と保険','最新の動向']],C:['金融資産運用',['マーケット環境の理解','預貯金・金融類似商品等','投資信託','債券投資','株式投資','外貨建商品','保険商品','金融派生商品','ポートフォリオ運用','金融商品と税金','セーフティネット','関連法規','最新の動向']],D:['タックスプランニング',['わが国の税制','所得税の仕組み','各種所得の内容','損益通算','所得控除','税額控除','所得税の申告と納付','個人住民税','個人事業税','法人税','法人住民税','法人事業税','消費税','会社・役員間および会社間の税務','決算書と法人税申告書','諸外国の税制度','最新の動向']],E:['不動産',['不動産の見方','不動産の取引','不動産に関する法令上の規制','不動産の取得・保有に係る税金','不動産の譲渡に係る税金','不動産の賃貸','不動産の有効活用','不動産の証券化','最新の動向']],F:['相続・事業承継',['贈与と法律','贈与と税金','相続と法律','相続と税金','相続財産の評価（不動産以外）','相続財産の評価（不動産）','不動産の相続対策','相続と保険の活用','事業承継対策','事業と経営','最新の動向']]};
const core=[{id:'A05-001',d:'A',s:4,q:'老齢基礎年金の受給開始年齢は、原則として何歳か。',c:['60歳','62歳','65歳','70歳'],a:2,e:'老齢基礎年金は原則65歳から受給します。',k:'公的年金',law:'2026-04-01'},{id:'C05-001',d:'C',s:4,q:'株価を1株当たり利益（EPS）で割って求める指標はどれか。',c:['PBR','PER','ROE','配当利回り'],a:1,e:'PER＝株価÷EPSです。',k:'PER',law:'2026-04-01'},{id:'D03-001',d:'D',s:2,q:'勤務先から受け取る給与・賞与は原則として何所得か。',c:['事業所得','給与所得','一時所得','雑所得'],a:1,e:'勤務先から受け取る給与や賞与は給与所得です。',k:'給与所得',law:'2026-04-01'},{id:'F03-001',d:'F',s:2,q:'相続が開始する原因として正しいものはどれか。',c:['被相続人の死亡','遺言書の作成','婚姻','退職'],a:0,e:'相続は被相続人の死亡によって開始します。',k:'相続の開始',law:'2026-04-01'}];
const all=[...core,...extraQuestions,...extraQuestions2,...extraQuestions3,...extraQuestions4,...extraQuestions5,...extraQuestions6,...extraQuestions7,...extraQuestions8];const seen=new Set();const questions=all.filter(q=>{if(!q||!q.id||seen.has(q.id))return false;seen.add(q.id);return true});
let S;try{S=JSON.parse(localStorage.getItem('fp2q')||'{"answers":{}}')}catch(e){S={answers:{}}}if(!S.answers)S.answers={};let route={page:'home'};function save(){try{localStorage.setItem('fp2q',JSON.stringify(S))}catch(e){}}function ans(q){return S.answers[q.id]}function stats(qs){qs=qs||questions;let d=qs.filter(ans).length,o=qs.filter(q=>ans(q)&&ans(q).ok).length;return{done:d,total:qs.length,rate:d?Math.round(o/d*100):0}}function shell(x){return `<div class="hero"><h1>FP2 Quest</h1><p>${questions.length}問収録・目標80%</p></div>${x}<div class="nav"><button onclick="goHome()">🏠<br>ホーム</button><button onclick="showWrong()">🔥<br>間違い</button><button onclick="showStats()">📊<br>成績</button></div>`}
function renderHome(){let st=stats();document.getElementById('app').innerHTML=shell(`<div class="card"><b>合格力メーター</b><p><b>${st.done}/${st.total}問</b>・正答率 <b>${st.rate}%</b></p><div class="bar"><i style="width:${st.total?st.done/st.total*100:0}%"></i></div><p class="muted">本番では60問中48問正解を安定目標にします。</p></div><div class="section">📚 範囲から学習</div>${Object.entries(domains).map(([k,v])=>`<button class="btn" onclick="openDomain('${k}')"><span class="pill">${k}</span> ${v[0]}<div class="muted">${questions.filter(q=>q.d===k).length}問</div></button>`).join('')}<div class="section">🎯 合格仕上げ</div><button class="btn primary" onclick="startMock()">📝 60問模試</button>`)}function goHome(){route={page:'home'};renderHome()}function openDomain(d){route={page:'domain',d};let v=domains[d];document.getElementById('app').innerHTML=shell(`<div class="head"><button class="back" onclick="goHome()">←</button><h2>${d} ${v[0]}</h2></div>${v[1].map((x,i)=>{let qs=questions.filter(q=>q.d===d&&q.s===i),st=stats(qs);return `<button class="btn" onclick="startSub('${d}',${i})"><b>${x}</b><div class="muted">${qs.length?st.done+'/'+st.total+'問・正答率 '+st.rate+'%':'問題準備中'}</div></button>`}).join('')}`)}function startSub(d,s){let qs=questions.filter(q=>q.d===d&&q.s===s);if(!qs.length)return openDomain(d);route={page:'quiz',d,s,qs,i:0};renderQuiz()}function renderQuiz(){let q=route.qs[route.i];document.getElementById('app').innerHTML=shell(`<div class="head"><button class="back" onclick="openDomain('${route.d}')">×</button><div><b>${q.k||''}</b><div class="muted">${route.i+1}/${route.qs.length}</div></div></div><div class="card"><div class="q">${q.q}</div>${q.c.map((c,i)=>`<button id="c${i}" class="choice" onclick="answerQ(${i})">${i+1}. ${c}</button>`).join('')}<button class="choice" onclick="answerQ(-1)">？ わからない</button><div id="fb"></div></div>`)}function answerQ(i){let q=route.qs[route.i],ok=i===q.a;S.answers[q.id]={ok,at:Date.now()};save();q.c.forEach((_,x)=>{let e=document.getElementById('c'+x);if(e){e.disabled=true;if(x===q.a)e.classList.add('good');if(x===i&&!ok)e.classList.add('bad')}});document.getElementById('fb').innerHTML=`<div class="card" style="box-shadow:none"><b>${ok?'○ 正解':'× 不正解'}</b><p>${q.e||''}</p><button class="btn primary" onclick="nextQ()">${route.i+1===route.qs.length?'終了':'次へ →'}</button></div>`}function nextQ(){route.i++;if(route.i>=route.qs.length)return openDomain(route.d);renderQuiz()}function showWrong(){let qs=questions.filter(q=>ans(q)&&!ans(q).ok);document.getElementById('app').innerHTML=shell(`<h2>🔥 間違えた問題</h2>${qs.length?qs.slice(0,100).map(q=>`<button class="btn" onclick="jump('${q.id}')">${q.k||q.id}<div class="muted">${q.q.slice(0,36)}…</div></button>`).join(''):'<div class="card">現在ありません。</div>'}`)}function jump(id){let q=questions.find(x=>x.id===id);route={page:'quiz',d:q.d,s:q.s,qs:[q],i:0};renderQuiz()}function showStats(){document.getElementById('app').innerHTML=shell(`<h2>📊 分野別成績</h2>${Object.entries(domains).map(([k,v])=>{let st=stats(questions.filter(q=>q.d===k));return `<div class="card"><b>${k} ${v[0]}</b><p>${st.done}/${st.total}問・正答率 ${st.rate}%</p></div>`}).join('')}`)}function startMock(){let qs=[];for(let d of ['A','B','C','D','E','F']){let a=questions.filter(q=>q.d===d);a=a.sort(()=>Math.random()-.5).slice(0,10);qs.push(...a)}route={page:'quiz',d:'A',s:0,qs:qs.sort(()=>Math.random()-.5),i:0};renderQuiz()}
renderHome();if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{})}
</script></body></html>
