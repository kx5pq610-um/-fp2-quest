<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FP2 Quest</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f7fb;color:#172033}.app{max-width:680px;margin:auto;padding:0 16px 90px}.hero{background:#173b8f;color:white;margin:0 -16px 18px;padding:24px 20px;border-radius:0 0 24px 24px}.hero h1{margin:0}.hero p{opacity:.88;margin:6px 0 0}.card,.btn{background:white;border-radius:16px;box-shadow:0 4px 16px #0001}.card{padding:16px;margin:12px 0}.btn{width:100%;border:0;padding:15px;margin:6px 0;text-align:left;font-size:16px;font-weight:700;color:#172033}.primary{background:#2563eb;color:white;text-align:center}.danger{background:#fff1f2}.muted{color:#64748b;font-size:13px}.choice{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid #e2e8f0;border-radius:12px;background:white;text-align:left;font-size:16px}.good{border-color:#22c55e;background:#f0fdf4}.bad{border-color:#ef4444;background:#fef2f2}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.row{display:flex;gap:10px}.row>*{flex:1}.pill{display:inline-block;font-size:12px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px}.section{font-weight:800;margin:22px 2px 8px}.back{border:0;background:white;border-radius:10px;padding:10px}.head{display:flex;gap:10px;align-items:center}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:flex;background:#fffffff2;border-top:1px solid #e2e8f0;padding:10px}.nav button{flex:1;border:0;background:none;font-size:12px;color:#64748b}.ok{color:#15803d;font-weight:800}.warn{color:#b45309;font-weight:800}</style></head><body><main id="app" class="app"><div class="hero"><h1>FP2 Quest</h1><p>読み込み中...</p></div><div class="card">問題データを確認しています。</div></main>
<script src="questions-extra.js?v=25"></script><script src="questions-pack2.js?v=25"></script><script src="questions-pack3.js?v=25"></script><script src="questions-pack4.js?v=25"></script><script src="questions-pack5.js?v=25"></script><script src="questions-pack6.js?v=25"></script><script src="questions-pack7.js?v=25"></script><script src="questions-pack8.js?v=25"></script><script src="questions-pack9.js?v=25"></script><script src="questions-pack10.js?v=25"></script><script src="questions-pack11.js?v=25"></script><script src="questions-pack12.js?v=25"></script><script>extraQuestions8.push(...extraQuestions9,...extraQuestions10,...extraQuestions11,...extraQuestions12);</script><script src="questions-pack13.js?v=25"></script><script src="questions-pack14.js?v=25"></script>
<script>(function(){var app=document.getElementById('app');try{
var core=[{id:'A05-001',d:'A',s:4,q:'老齢基礎年金の受給開始年齢は、原則として何歳か。',c:['60歳','62歳','65歳','70歳'],a:2,e:'老齢基礎年金は原則65歳から受給します。',k:'公的年金',law:'2026-04-01'}];
var all=core.concat(extraQuestions,extraQuestions2,extraQuestions3,extraQuestions4,extraQuestions5,extraQuestions6,extraQuestions7,extraQuestions8),seen={},questions=all.filter(function(q){if(!q||!q.id||seen[q.id])return false;seen[q.id]=1;return true});
var names={A:'ライフプランニングと資金計画',B:'リスク管理',C:'金融資産運用',D:'タックスプランニング',E:'不動産',F:'相続・事業承継'};
var subs={A:['FPと倫理','FPと関連法規','ライフプランニングの考え方・手法','社会保険','公的年金','企業年金・個人年金等','年金と税金','ライフプラン策定上の資金計画','中小法人の資金計画','ローンとカード','最新の動向'],B:['リスクマネジメント','保険制度全般','生命保険','損害保険','第三分野の保険','リスク管理と保険','最新の動向'],C:['マーケット環境の理解','預貯金・金融類似商品等','投資信託','債券投資','株式投資','外貨建商品','保険商品','金融派生商品','ポートフォリオ運用','金融商品と税金','セーフティネット','関連法規','最新の動向'],D:['わが国の税制','所得税の仕組み','各種所得の内容','損益通算','所得控除','税額控除','所得税の申告と納付','個人住民税','個人事業税','法人税','法人住民税','法人事業税','消費税','会社・役員間および会社間の税務','決算書と法人税申告書','諸外国の税制度','最新の動向'],E:['不動産の見方','不動産の取引','不動産に関する法令上の規制','不動産の取得・保有に係る税金','不動産の譲渡に係る税金','不動産の賃貸','不動産の有効活用','不動産の証券化','最新の動向'],F:['贈与と法律','贈与と税金','相続と法律','相続と税金','相続財産の評価（不動産以外）','相続財産の評価（不動産）','不動産の相続対策','相続と保険の活用','事業承継対策','事業と経営','最新の動向']};
var S={answers:{},last:null,mocks:[]};try{var old=JSON.parse(localStorage.getItem('fp2q')||'{}');if(old&&old.answers)S.answers=old.answers;if(old&&old.last)S.last=old.last;if(old&&old.mocks)S.mocks=old.mocks}catch(e){}
function save(){try{localStorage.setItem('fp2q',JSON.stringify(S))}catch(e){}}function A(q){return S.answers[q.id]}function stat(qs){var d=0,o=0;for(var i=0;i<qs.length;i++){var a=A(qs[i]);if(a){d++;if(a.ok)o++}}return{done:d,total:qs.length,rate:d?Math.round(o/d*100):0}}
function shell(x){return '<div class="hero"><h1>FP2 Quest</h1><p>'+questions.length+'問収録・目標正答率80%</p></div>'+x+'<div class="nav"><button onclick="goHome()">🏠<br>ホーム</button><button onclick="showWrong()">🔥<br>間違い</button><button onclick="showStats()">📊<br>成績</button></div>'}
function home(){var st=stat(questions),msg=st.done<60?'まず60問以上解いて実力判定':st.rate>=80?'🏆 80％到達':'🎯 80％まであと '+(80-st.rate)+'pt';var h='<div class="card"><b>合格力メーター</b><div class="row"><div><span class="muted">進捗</span><br><b>'+st.done+'/'+st.total+'問</b></div><div><span class="muted">正答率</span><br><b>'+st.rate+'%</b></div></div><div class="bar" style="margin-top:12px"><i style="width:'+(st.total?st.done/st.total*100:0)+'%"></i></div><p><b>'+msg+'</b></p><span class="muted">FP2 Questでは本番で48/60以上を安定目標にします。</span></div>';if(S.last)h+='<button class="btn primary" onclick="resumeLast()">▶ 前回の続きから</button>';h+='<div class="section">📚 範囲から学習</div>';Object.keys(names).forEach(function(d){var qs=questions.filter(function(q){return q.d===d});h+='<button class="btn" onclick="openD(\''+d+'\')"><span class="pill">'+d+'</span> '+names[d]+'<div class="muted">'+qs.length+'問</div></button>'});h+='<div class="section">🎯 合格仕上げ</div><button class="btn primary" onclick="mock60()">📝 60問模試</button>';if(S.mocks.length){var m=S.mocks[S.mocks.length-1];h+='<div class="card"><b>直近の模試</b><p><b>'+m.score+'/60</b>（'+Math.round(m.score/60*100)+'％）</p></div>'}app.innerHTML=shell(h)}window.goHome=home;
window.openD=function(d){var h='<div class="head"><button class="back" onclick="goHome()">←</button><h2>'+d+' '+names[d]+'</h2></div>';for(var i=0;i<subs[d].length;i++){var qs=questions.filter(function(q){return q.d===d&&q.s===i}),st=stat(qs);h+='<button class="btn" onclick="openSub(\''+d+'\','+i+')"><b>'+d+String(i+1).padStart(2,'0')+' '+subs[d][i]+'</b><div class="muted">'+(qs.length?st.done+'/'+st.total+'問・正答率 '+st.rate+'% '+(st.done>=5&&st.rate>=80?'✓':''):'問題準備中')+'</div></button>'}app.innerHTML=shell(h)};
window.openSub=function(d,s){var qs=questions.filter(function(q){return q.d===d&&q.s===s}),st=stat(qs),h='<div class="head"><button class="back" onclick="openD(\''+d+'\')">←</button><h2>'+subs[d][s]+'</h2></div><div class="card"><b>学習進捗 '+st.done+'/'+st.total+'問</b><div class="bar" style="margin:10px 0"><i style="width:'+(st.total?st.done/st.total*100:0)+'%"></i></div><span class="muted">正答率 '+st.rate+'%・目標80%</span>'+(st.done>=5&&st.rate>=80?'<p class="ok">✓ この範囲は80％到達</p>':'')+'</div>';if(qs.length){h+='<button class="btn primary" onclick="startSub(\''+d+'\','+s+',false)">⚡ この範囲を学習する</button><button class="btn" onclick="startSub(\''+d+'\','+s+',true)">🔥 この範囲の間違いだけ</button>'}else h+='<div class="card">この範囲の問題は準備中です。</div>';app.innerHTML=shell(h)};
var session=null;window.startSub=function(d,s,wrongOnly){var qs=questions.filter(function(q){return q.d===d&&q.s===s});if(wrongOnly)qs=qs.filter(function(q){var a=A(q);return a&&!a.ok});if(!qs.length){alert('対象の問題はありません');return}startSession(qs,0,{kind:'study',d:d,s:s,score:0})};
function startSession(qs,i,meta){session={qs:qs,i:i,kind:meta.kind||'study',d:meta.d,s:meta.s,score:meta.score||0,locked:false};showQ()}
function showQ(){var q=session.qs[session.i];if(!q)return finish();if(session.kind==='study'){S.last={d:q.d,s:q.s,id:q.id};save()}app.innerHTML=shell('<div class="head"><button class="back" onclick="goHome()">×</button><div><b>'+(q.k||'問題')+'</b><div class="muted">'+(session.i+1)+'/'+session.qs.length+'・'+q.id+'</div></div></div><div class="card"><div style="font-size:20px;line-height:1.55;font-weight:700">'+q.q+'</div>'+q.c.map(function(c,x){return '<button id="c'+x+'" class="choice" onclick="pick('+x+')">'+(x+1)+'. '+c+'</button>'}).join('')+'<button id="unknown" class="choice" onclick="pick(-1)">？ わからない</button><div id="fb"></div></div>')}
window.pick=function(x){if(!session||session.locked)return;session.locked=true;var q=session.qs[session.i],ok=x===q.a;if(session.kind==='mock'){if(ok)session.score++}else{S.answers[q.id]={ok:ok,at:Date.now()};save()}for(var j=0;j<q.c.length;j++){var el=document.getElementById('c'+j);if(el){el.disabled=true;if(j===q.a)el.className+=' good';if(j===x&&!ok)el.className+=' bad'}}var u=document.getElementById('unknown');if(u)u.disabled=true;document.getElementById('fb').innerHTML='<div class="card" style="box-shadow:none"><b>'+(ok?'○ 正解':'× 不正解')+'</b><p>'+((q.e)||'')+'</p><button class="btn primary" id="next">'+(session.i+1===session.qs.length?'結果を見る':'次へ →')+'</button></div>';document.getElementById('next').onclick=function(){session.i++;session.locked=false;showQ()}};
function finish(){if(!session)return home();if(session.kind==='mock'){var score=session.score,rate=Math.round(score/60*100);S.mocks.push({score:score,at:Date.now()});if(S.mocks.length>20)S.mocks.shift();save();app.innerHTML=shell('<h2>📝 60問模試 結果</h2><div class="card"><div style="font-size:36px;font-weight:900">'+score+'/60</div><p>正答率 '+rate+'％</p><p><b>'+(score>=48?'🏆 8割到達':score>=36?'✅ 合格基準クリア':'📚 合格基準まであと '+(36-score)+'問')+'</b></p><div class="bar"><i style="width:'+rate+'%"></i></div><p class="muted">公式合格基準は36/60。FP2 Questでは48/60を安定目標にします。</p></div><button class="btn primary" onclick="mock60()">もう一度</button>');session=null;return}var d=session.d,s=session.s;session=null;openSub(d,s)}
window.resumeLast=function(){if(!S.last)return home();var qs=questions.filter(function(q){return q.d===S.last.d&&q.s===S.last.s}),idx=0;for(var i=0;i<qs.length;i++)if(qs[i].id===S.last.id){idx=i;break}if(!qs.length)return home();startSession(qs,idx,{kind:'study',d:S.last.d,s:S.last.s})};
window.showWrong=function(){var qs=questions.filter(function(q){var a=A(q);return a&&!a.ok}),h='<h2>🔥 間違えた問題</h2>';if(!qs.length)h+='<div class="card">現在、間違い問題はありません。</div>';else{h+='<button class="btn primary" onclick="startWrongAll()">間違い '+qs.length+'問をまとめて解く</button>';qs.slice(0,100).forEach(function(q){h+='<button class="btn" onclick="jump(\''+q.id+'\')">'+(q.k||q.id)+'<div class="muted">'+names[q.d]+' › '+subs[q.d][q.s]+'</div></button>'})}app.innerHTML=shell(h)};window.startWrongAll=function(){var qs=questions.filter(function(q){var a=A(q);return a&&!a.ok});if(qs.length)startSession(qs,0,{kind:'study',d:qs[0].d,s:qs[0].s})};window.jump=function(id){var q=questions.filter(function(x){return x.id===id})[0];if(q)startSession([q],0,{kind:'study',d:q.d,s:q.s})};
window.showStats=function(){var h='<h2>📊 分野別成績</h2>';Object.keys(names).forEach(function(d){var st=stat(questions.filter(function(q){return q.d===d}));h+='<div class="card"><b>'+d+' '+names[d]+'</b><p>'+st.done+'/'+st.total+'問・正答率 <b>'+st.rate+'%</b></p><div class="bar"><i style="width:'+st.rate+'%"></i></div>'+(st.done>=10&&st.rate>=80?'<p class="ok">✓ 80％到達</p>':'')+'</div>'});app.innerHTML=shell(h)};
window.mock60=function(){var qs=[];['A','B','C','D','E','F'].forEach(function(d){var a=questions.filter(function(q){return q.d===d}).slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}qs=qs.concat(a.slice(0,10))});for(var k=qs.length-1;k>0;k--){var z=Math.floor(Math.random()*(k+1)),u=qs[k];qs[k]=qs[z];qs[z]=u}startSession(qs,0,{kind:'mock',score:0})};
home();
}catch(e){app.innerHTML='<div class="hero"><h1>FP2 Quest</h1><p>起動エラー</p></div><div class="card"><b>❌ '+String(e)+'</b></div>'}})();</script></body></html>
